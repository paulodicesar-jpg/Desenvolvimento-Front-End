<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
    </header>

    <section aria-labelledby="titulo-filtros">
        <h2 id="titulo-filtros">Filtros e Busca</h2>
        <form role="search">
            <p>
                <label for="busca-titulo">Buscar por título ou responsável:</label>
                <input type="search" id="busca-titulo" name="busca" placeholder="Ex: Estudar para prova">
            </p>
            <fieldset>
                <legend>Filtrar por Status</legend>
                <p>
                    <label for="filtro-status-todos">
                        <input type="radio" id="filtro-status-todos" name="status" value="todos" checked>
                        Todos
                    </label>
                </p>
                <p>
                    <label for="filtro-status-afazer">
                        <input type="radio" id="filtro-status-afazer" name="status" value="afazer">
                        A Fazer
                    </label>
                </p>
                <p>
                    <label for="filtro-status-andamento">
                        <input type="radio" id="filtro-status-andamento" name="status" value="andamento">
                        Em Andamento
                    </label>
                </p>
                <p>
                    <label for="filtro-status-revisao">
                        <input type="radio" id="filtro-status-revisao" name="status" value="revisao">
                        Em Revisão
                    </label>
                </p>
                <p>
                    <label for="filtro-status-concluido">
                        <input type="radio" id="filtro-status-concluido" name="status" value="concluido">
                        Concluída
                    </label>
                </p>
            </fieldset>

            <!-- Filtro por Prioridade -->
            <p>
                <label for="filtro-prioridade">Filtrar por Prioridade:</label>
                <select id="filtro-prioridade" name="prioridade">
                    <option value="todas">Todas as Prioridades</option>
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                </select>
            </p>

            <button type="submit">Aplicar Filtros</button>
        </form>
    </section>

    <!-- Região viva para acessibilidade (DEVE nascer vazia na marcação inicial) -->
    <div id="status-regiao" role="status" aria-live="polite" class="sr-only"></div>

    <!-- O main DEVE nascer vazio no HTML; o JS irá preenchê-lo dinamicamente -->
    <main></main>

    <footer>
        <p>Desenvolvido por <strong>Paulo Cesar</strong> — Disciplina: Desenvolvimento Frontend (2026.2)</p>
    </footer>

    <!-- Script principal como Módulo ES6 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
